name: R smoke tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gsfonts \
            libcurl4-openssl-dev \
            libglpk-dev \
            libmagick++-dev \
            libuv1-dev

      - name: Restore renv environment
        uses: r-lib/actions/setup-renv@v2

      - name: Verify renv status
        shell: Rscript {0}
        run: |
          status <- renv::status()
          if (!isTRUE(status$synchronized)) {
            stop("renv project is not synchronized with renv.lock")
          }

      - name: Parse project R files
        shell: Rscript {0}
        run: |
          files <- list.files(
            ".",
            pattern = "\\.[Rr]$",
            recursive = TRUE,
            full.names = TRUE
          )

          files <- files[
            !grepl(
              "(^|/)renv/",
              files
            )
          ]

          for (file in files) {
            message("Parsing ", file)
            parse(file = file)
          }

      - name: Smoke-test shared project initialization
        shell: Rscript {0}
        run: |
          source("project_support.R")

          required_functions <- c(
            "entropy",
            "richness",
            "extract_game_moves",
            "HPDI",
            "sgf_to_korschelt"
          )

          missing <- required_functions[
            !vapply(
              required_functions,
              exists,
              logical(1),
              mode = "function",
              inherits = TRUE
            )
          ]

          if (length(missing) > 0L) {
            stop(
              "project_support.R did not load required functions: ",
              paste(missing, collapse = ", ")
            )
          }

      - name: Run unit and smoke tests
        run: Rscript tests/run_tests.R
